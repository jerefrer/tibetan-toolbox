# The single source of truth for every tool in the directory.
#
# Required: id, name, url, author {name, url}, description, needs (ids from needs.yaml),
#           platforms (web | mac | windows | ios | android), free, openSource, developer
# Optional: repo (source URL), language (libraries), maintainer: jerefrer (the site's maintainer's own tools),
#           teaser: "short note" (lists the library in the home page's developer teaser)
#           stack: [javascript, python] (language logos shown next to the teaser)
#           specimen: [width, height] (fonts: display size of the sample in assets/img/specimens/<id>.png)
# Keep descriptions to what the tool's own page or README says.

# ---------------------------------------------------------------- Frère Jérémy: tools

- id: tibetan-translator
