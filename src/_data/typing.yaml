  metaTitle: Practise typing Tibetan in Wylie
  metaDescription: Practise Wylie online on any computer or phone, with nothing to install. Type Wylie and see Tibetan, then play a word game with hints.
  crumb: Practise
  card: Try Wylie here, on any computer or phone.
  lead: "Try it here, with any keyboard: what you type in Wylie appears in Tibetan. Nothing needs installing."
  freeLabel: Type in Wylie
  freePlaceholder: sangs rgyas
  gameTitle: Type the word
  gameLead: "A word in Tibetan: type it in Wylie, every vowel included, and end with a space for the final tsheg. Stuck? Ask for a hint."
  answerLabel: Your answer, in Wylie
  position: "Word {n} of {total}"
  previous: Previous word
  hint: Hint
  reveal: Show the answer
  next: Next word
  perfect: "Perfect!"
  pressEnter: Press Enter for the next word.
  noTsheg: "Correct! Just add a space for the final tsheg ་."
  pressEnterAgain: Press Enter again for the next word.
  missingVowel: "Almost: every syllable needs its vowel written. Type `{wylie}`."
  notYet: "Not yet. Next, type `{wylie}`."
  hintText: "Next, type `{wylie}`."
  answerText: "Type `{wylie}`, then a space."
  noScript: The practice needs JavaScript, which is switched off in this browser.
  # Easiest first: one-letter syllables, then the standard stacks, then the dot and the plus.
  words:
